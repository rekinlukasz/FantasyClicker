<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fantasy Clicker</title>
  <link rel="stylesheet" href="https://pyscript.net/releases/2024.11.1/core.css">
  <script type="module" src="https://pyscript.net/releases/2024.11.1/core.js"></script>
  <style>
    body {
      margin: 0;
      font-family: Georgia, serif;
      background: linear-gradient(#1b1030, #2d1b4e);
      color: #f3e9d2;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    main { width: 100%; max-width: 700px; padding: 16px; text-align: center; }
    h1 { color: #ffd166; margin-bottom: 4px; }
    #gold { font-size: 2rem; margin: 8px 0; }
    #perSec { opacity: 0.8; }
    #crystal {
      font-size: 120px;
      background: none;
      border: none;
      cursor: pointer;
      user-select: none;
      transition: transform 0.08s;
      margin: 16px 0;
    }
    #crystal:active { transform: scale(0.9); }
    #shop { display: grid; gap: 10px; text-align: left; }
    .item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #3b2766;
      border: 2px solid #6b4fa3;
      border-radius: 10px;
      padding: 10px;
      color: inherit;
      font: inherit;
      cursor: pointer;
      text-align: left;
    }
    .item:disabled { opacity: 0.45; cursor: not-allowed; }
    .item .icon { font-size: 2rem; }
    .item .info { flex: 1; }
    .item .count { font-size: 1.5rem; color: #ffd166; }
    .floater {
      position: fixed;
      pointer-events: none;
      color: #ffd166;
      font-weight: bold;
      animation: float 0.8s ease-out forwards;
    }
    @keyframes float {
      to { transform: translateY(-60px); opacity: 0; }
    }
  </style>
</head>
<body>
  <main>
    <h1>⚔️ Fantasy Clicker</h1>
    <div id="gold">Ładowanie magii…</div>
    <div id="perSec"></div>
    <button id="crystal" title="Kliknij kryształ!">💎</button>
    <h2>Sklep</h2>
    <div id="shop"></div>
    <p><button id="reset">Zacznij od nowa</button></p>
  </main>
  <script type="py" src="main.py"></script>
</body>
</html>
